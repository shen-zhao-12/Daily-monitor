name: 线口监测

on:
  schedule:
    - cron: "15 0 * * *"  # 北京时间 08:15 早报
    - cron: "20 1 * * *"  # 北京时间 09:20 早报备份
    - cron: "5 7 * * *"   # 北京时间 15:05 午报
    - cron: "10 8 * * *"  # 北京时间 16:10 午报备份

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 运行线口监测
        run: python monitor.py
        env:
          DASHSCOPE_API_KEY: ${{ secrets.DASHSCOPE_API_KEY }}

      - name: 提交简报产物
        run: |
          git config user.name "beat-monitor-bot"
          git config user.email "beat-monitor-bot@users.noreply.github.com"
          git add briefings web/data
          if ! git diff --staged --quiet; then
            git commit -m "briefing: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi

      - name: 上传网页产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: web

      - name: 发布到 GitHub Pages
        uses: actions/deploy-pages@v4
        continue-on-error: true

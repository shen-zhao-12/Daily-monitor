<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>线口监测 · 沈钊</title>
<style>
  :root { --brand:#41D87E; --ink:#1a1a1a; --gray:#8a8a8a; --line:#eee; --bg:#f7f8f7; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif; background:var(--bg); color:var(--ink); line-height:1.65; }
  header { background:#fff; border-bottom:3px solid var(--brand); position:sticky; top:0; z-index:9; }
  .hd { max-width:860px; margin:0 auto; padding:14px 16px; display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .hd h1 { font-size:19px; }
  .hd h1 b { color:var(--brand); }
  .hd select { margin-left:auto; padding:6px 10px; border:1px solid #ddd; border-radius:8px; font-size:13px; background:#fff; }
  main { max-width:860px; margin:0 auto; padding:16px; }
  .meta { color:var(--gray); font-size:13px; margin-bottom:12px; }
  .flash { background:#fff; border-radius:12px; padding:16px; margin-bottom:18px; border-left:4px solid var(--brand); }
  .flash h2, section h2 { font-size:16px; margin-bottom:10px; }
  .flash h2 b, section h2 b { color:var(--brand); }
  .flash ol { padding-left:20px; font-size:14px; }
  .flash li { margin-bottom:6px; }
  section { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .lead { padding:12px 0; border-bottom:1px solid var(--line); }
  .lead:last-child { border-bottom:none; }
  .lt { font-size:15px; font-weight:600; margin-bottom:4px; }
  .badge { display:inline-block; font-size:11px; padding:1px 8px; border-radius:10px; margin-right:6px; vertical-align:2px; font-weight:600; white-space:nowrap; }
  .bA { background:var(--brand); color:#fff; }
  .bB { background:#e8e8e8; color:#444; }
  .bC { background:#f4f4f4; color:#999; }
  .loc { background:#fff3e0; color:#e07b00; border:1px solid #ffd9a0; }
  .ls { font-size:12px; color:var(--gray); margin-bottom:4px; }
  .ld { font-size:14px; }
  .la { font-size:13px; color:#0a7d43; margin-top:4px; font-style:italic; }
  .lk { font-size:13px; margin-top:4px; }
  .lk a { color:#0563C1; text-decoration:none; }
  .empty { color:var(--gray); font-size:14px; padding:6px 0; }
  .dlbtn { display:inline-block; margin:4px 0 14px; background:var(--brand); color:#fff; text-decoration:none; padding:8px 18px; border-radius:8px; font-size:14px; font-weight:600; }
  .hist { background:#fff; border-radius:12px; padding:16px; margin-bottom:14px; }
  .hist h2 { font-size:16px; margin-bottom:10px; }
  .hist .row { display:flex; justify-content:space-between; align-items:center; gap:8px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  .hist .row:last-child { border-bottom:none; }
  .hist a { color:#0563C1; text-decoration:none; white-space:nowrap; }
  .stats { font-size:12px; color:var(--gray); margin-top:8px; }
  footer { text-align:center; color:#bbb; font-size:12px; padding:20px 0 30px; }
  .load { text-align:center; color:var(--gray); padding:40px 0; }
  @media (max-width:600px){ .hd h1{font-size:16px;} }
</style>
</head>
<body>
<header>
  <div class="hd">
    <h1>线口监测 <b>·</b> 羊城晚报 沈钊</h1>
    <select id="picker" onchange="loadBriefing(this.value)"></select>
  </div>
</header>
<main id="app"><div class="load">正在加载简报…</div></main>
<footer>千问办公——专业人士,都用千问办公。</footer>
<script>
const BEATS = ["AI/大模型","机器人/AI硬件","无人驾驶/低空/智慧出行","电商/直播/即时零售","游戏/电竞/平台公司","消费/以旧换新/新餐饮"];
const $ = s => document.querySelector(s);
let manifest = [];

async function init() {
  try {
    manifest = await (await fetch("data/manifest.json", {cache:"no-store"})).json();
    if (!manifest.length) throw new Error("empty");
    const sel = $("#picker");
    manifest.forEach((m, i) => {
      const o = document.createElement("option");
      o.value = m.dataPath; o.textContent = m.title;
      sel.appendChild(o);
    });
    loadBriefing(manifest[0].dataPath);
  } catch (e) {
    $("#app").innerHTML = '<div class="load">暂无简报数据。首次运行后此页自动展示(GitHub Actions 每天 09:00 / 15:00 生成)。</div>';
  }
}

async function loadBriefing(path) {
  $("#app").innerHTML = '<div class="load">加载中…</div>';
  const b = await (await fetch(path, {cache:"no-store"})).json();
  const gradeName = {A:"A级·线索", B:"B级·关注", C:"C级·参考"};
  let html = '<div class="meta">' + b.title + " · 生成于 " + b.date + "</div>";
  html += '<a class="dlbtn" href="' + b.docx + '" download>下载 Word 简报</a>';

  if (b.flash && b.flash.length) {
    html += '<div class="flash"><h2><b>今日要闻速览</b></h2><ol>';
    b.flash.forEach(f => {
      html += "<li>" + (f.local ? '<span class="badge loc">本地</span>' : "") +
              "<b>" + esc(f.title) + "</b> —— " + esc(f.summary || "详见下文") + "(" + esc(f.source) + ")</li>";
    });
    html += "</ol></div>";
  }

  BEATS.forEach(beat => {
    html += "<section><h2>" + esc(beat) + "</h2>";
    const its = (b.sections || {})[beat] || [];
    if (!its.length) { html += '<div class="empty">本线口暂无重要更新</div>'; }
    its.forEach(it => {
      html += '<div class="lead"><div class="lt">' +
        '<span class="badge b' + it.grade + '">' + (gradeName[it.grade] || it.grade) + "</span>" +
        (it.local ? '<span class="badge loc">本地</span>' : "") + esc(it.title) + "</div>" +
        '<div class="ls">来源:' + esc(it.source) + " | 时间:" + esc(it.time || "") + "</div>" +
        (it.summary ? '<div class="ld">' + esc(it.summary) + "</div>" : "") +
        (it.angle ? '<div class="la">角度建议:' + esc(it.angle) + "</div>" : "") +
        (it.url ? '<div class="lk"><a href="' + esc(it.url) + '" target="_blank" rel="noopener">查看原文 →</a></div>' : "") +
        "</div>";
    });
    html += "</section>";
  });

  if (b.stats) {
    html += '<div class="hist"><h2>信源状态</h2><div class="stats">可用:' +
      esc((b.stats.ok || []).join("、") || "无") + "<br>暂不可用:" +
      esc((b.stats.fail || []).join("、") || "无") + "</div></div>";
  }

  if (manifest.length > 1) {
    html += '<div class="hist"><h2>历史简报</h2>';
    manifest.slice(1, 15).forEach(m => {
      html += '<div class="row"><span>' + esc(m.title) + "</span><span>" +
        '<a href="' + m.dataPath + '" onclick="viewHist(event,\'' + m.dataPath + '\')">查看</a> · ' +
        '<a href="' + m.docxPath + '" download>Word</a></span></div>';
    });
    html += "</div>";
  }
  $("#app").innerHTML = html;
  window.scrollTo(0, 0);
}

function viewHist(e, path) {
  e.preventDefault();
  $("#picker").value = path;
  loadBriefing(path);
}

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
init();
</script>
</body>
</html>
